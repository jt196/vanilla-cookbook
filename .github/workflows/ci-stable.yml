name: CI - Test and Build (Stable Release)

on:
  release:
    types: [published]

jobs:
  run-tests:
    if: github.repository == 'jt196/vanilla-cookbook'
    uses: ./.github/workflows/run-tests.yml
    with:
      run_e2e: true
      run_llm_smoke: false
      # No AI keys: only the opt-in LLM smoke test uses them, and it's off here

  docker-build-stable:
    if: github.repository == 'jt196/vanilla-cookbook'
    needs: run-tests
    # Queue rather than cancel: every release tag should be published
    concurrency:
      group: docker-stable
      cancel-in-progress: false
    uses: ./.github/workflows/docker-build.yml
    with:
      docker_tags: |
        stable
        type=ref,event=tag
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
