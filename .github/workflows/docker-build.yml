name: Docker Build and Push

on:
  workflow_call:
    inputs:
      docker_tags:
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jt196/vanilla-cookbook
          tags: ${{ inputs.docker_tags }}

      - name: Get Git version
        id: git_version
        run: |
          version=$(git describe --tags --abbrev=0)-$(git rev-parse --short HEAD)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=jt196/vanilla-cookbook:buildcache
          cache-to: type=registry,ref=jt196/vanilla-cookbook:buildcache,mode=max
          build-args: |
            GIT_VERSION=${{ steps.git_version.outputs.version }}
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
