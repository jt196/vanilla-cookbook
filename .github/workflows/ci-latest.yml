name: CI - Test and Build (Latest)

on:
  push:
    branches:
      - main
    # Changes that don't affect the Docker image shouldn't republish :latest
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.readthedocs.yaml'
      - '.markdownlint.json'
      - 'android/**'
  pull_request:
    branches:
      - main

# A new push to a PR cancels that PR's in-flight run. Pushes to main each get their own group;
# the :latest build has its own concurrency rule below.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    if: github.repository == 'jt196/vanilla-cookbook' && github.event_name == 'pull_request'
    uses: ./.github/workflows/run-tests.yml
    with:
      run_e2e: false
      run_llm_smoke: false
      # No AI keys: only the opt-in LLM smoke test uses them, and it's off here

  # Catch a broken Dockerfile before it reaches main, where every merge publishes :latest.
  # Both platforms build natively in parallel; nothing is pushed.
  docker-build-check:
    if: github.repository == 'jt196/vanilla-cookbook' && github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      docker_tags: type=ref,event=pr
      push: false
      platforms: '["linux/amd64", "linux/arm64"]'

  docker-build-latest:
    if: github.repository == 'jt196/vanilla-cookbook' && github.event_name == 'push'
    # A newer push to main supersedes an in-flight build, so an older build can't finish last and overwrite :latest
    concurrency:
      group: docker-latest
      cancel-in-progress: true
    uses: ./.github/workflows/docker-build.yml
    with:
      docker_tags: latest
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
