name: CI - Test and Build (Latest)

on:
  push:
    branches:
      - main
    # Changes that don't affect the Docker image shouldn't republish :latest
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.readthedocs.yaml'
      - '.markdownlint.json'
      - 'android/**'
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    if: github.repository == 'jt196/vanilla-cookbook' && github.event_name == 'pull_request'
    uses: ./.github/workflows/run-tests.yml
    with:
      run_e2e: false
      run_llm_smoke: false
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}

  # Catch a broken Dockerfile before it reaches main, where every merge publishes :latest.
  # amd64 only and no push, to keep it quick.
  docker-build-check:
    if: github.repository == 'jt196/vanilla-cookbook' && github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      docker_tags: type=ref,event=pr
      push: false
      platforms: linux/amd64

  docker-build-latest:
    if: github.repository == 'jt196/vanilla-cookbook' && github.event_name == 'push'
    # A newer push to main supersedes an in-flight build, so an older build can't finish last and overwrite :latest
    concurrency:
      group: docker-latest
      cancel-in-progress: true
    uses: ./.github/workflows/docker-build.yml
    with:
      docker_tags: latest
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
