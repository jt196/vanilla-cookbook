name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
  # Check the APK still builds when the Android project or this workflow changes
  pull_request:
    paths:
      - 'android/**'
      - 'android-web/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: pnpm install

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease

      # PR builds only check that the app compiles. Signing needs the repository secrets,
      # which Dependabot PRs don't get.
      # Signed with the SDK's own zipalign/apksigner so no third-party action handles the key;
      # passwords go through env vars rather than the command line.
      - name: Sign APK
        if: github.event_name != 'pull_request'
        id: sign
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$keystore"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk"
          echo "signedReleaseFile=$RUNNER_TEMP/signed.apk" >> "$GITHUB_OUTPUT"

      - name: Rename signed APK for release asset
        if: github.event_name != 'pull_request'
        id: apk_asset
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          # Manual runs from a branch like "fix/x" use the branch name; keep the file name slash-free
          TAG_NAME="${TAG_NAME//\//-}"
          OUTPUT_FILE="vanilla-cookbook-${TAG_NAME}.apk"
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "$OUTPUT_FILE"
          echo "file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk_asset.outputs.file }}" --clobber --repo "${{ github.repository }}"

      # Manual builds: attach the APK to the workflow run instead of creating a release
      - name: Upload APK as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk_asset.outputs.file }}
          path: ${{ steps.apk_asset.outputs.file }}
          retention-days: 14
