name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
  # Check the APK still builds when the Android project or this workflow changes
  pull_request:
    paths:
      - 'android/**'
      - 'android-web/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: pnpm install

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease

      - name: Sign APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Rename signed APK for release asset
        id: apk_asset
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          # PR refs look like "438/merge"; keep the file name slash-free
          TAG_NAME="${TAG_NAME//\//-}"
          OUTPUT_FILE="vanilla-cookbook-${TAG_NAME}.apk"
          cp "${{ steps.sign.outputs.signedReleaseFile }}" "$OUTPUT_FILE"
          echo "file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk_asset.outputs.file }}

      # Manual and PR builds: attach the APK to the workflow run instead of creating a release
      - name: Upload APK as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk_asset.outputs.file }}
          path: ${{ steps.apk_asset.outputs.file }}
          retention-days: 14
